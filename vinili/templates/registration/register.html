{% extends "base.html" %}

{% block content %}
<section class="login-container">
    <div class="login-box">
        <h2>Unisciti al Club</h2>
        
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div style="color: #e74c3c; font-size: 0.8rem; margin-top: 5px;">
                            {{ field.errors.0 }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn">Crea Account</button>
        </form>
        
        <div class="footer-links">
            <p>Hai già un account? <a href="{% url 'login' %}">Accedi qui</a></p>
        </div>
    </div>
</section>
{% endblock %}
